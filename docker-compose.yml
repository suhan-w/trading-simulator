services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_sim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trading_sim
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-for-production}
      # development = signup codes may be logged if RESEND_API_KEY is unset; production = RESEND_API_KEY required
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Bump when the UI “didn’t change” after edits (e.g. iCloud delay): CACHEBUST=$(date +%s) docker compose build web
      args:
        CACHEBUST: ${CACHEBUST:-}
    ports:
      # 8080 avoids macOS AirPlay / other apps that bind :80
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
